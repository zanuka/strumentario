name: Evals

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Braintrust eval suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Skip when Braintrust key is missing
        id: gate
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
        run: |
          if [ -z "$BRAINTRUST_API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "BRAINTRUST_API_KEY is not configured; skipping evals."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run evals
        if: steps.gate.outputs.skip != 'true'
        run: pnpm eval
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          BRAINTRUST_PROJECT: strumentario
